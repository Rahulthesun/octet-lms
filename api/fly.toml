# fly.toml app configuration file generated for api-satin-leaf-209 on 2026-06-12T00:57:45+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'api-satin-leaf-209'
primary_region = 'bom'

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  # 256 MB is not enough: the API (googleapis, AWS SDK, PDF generation) was
  # being OOM-killed on startup, which the browser reported as CORS errors.
  memory = '512mb'
  cpus = 1
  memory_mb = 512
